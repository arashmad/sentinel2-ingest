[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sentinel2-ingest"
version = "0.1.0"
description = "Inspect and download Sentinel-2 imagery."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel2_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

